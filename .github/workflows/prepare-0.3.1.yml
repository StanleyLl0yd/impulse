name: Prepare 0.3.1 migration

on:
  push:
    branches:
      - fix/splash-audio-0.3.1

permissions:
  contents: write

jobs:
  prepare:
    name: Apply migration
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/splash-audio-0.3.1
          fetch-depth: 0

      - name: Apply migration
        run: python3 tools/prepare_031.py

      - name: Commit prepared release
        run: |
          set -euo pipefail
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix: lock app identity and polish launch audio"
          git push origin HEAD:fix/splash-audio-0.3.1
