name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Java and Kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Android build environment
        uses: ./.github/actions/android-gradle-setup
        with:
          gradle-cache-read-only: true

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build for analysis
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d
