name: Finalize splash asset

on:
  push:
    branches:
      - fix/splash-audio-0.3.1

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'ci: finalize valid splash asset'
    name: Finalize valid splash asset
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Restore splash asset
        run: |
          set -euo pipefail
          cat .tmp/splash-q100.b64.part-* | base64 --decode > app/src/main/res/drawable-nodpi/impulse_splash.webp
          test "$(stat -c%s app/src/main/res/drawable-nodpi/impulse_splash.webp)" = "333140"
          echo "5dd408690e083dc0220414f900705b5cd5b4f002ce46f4dc6d4538c327eca6f7  app/src/main/res/drawable-nodpi/impulse_splash.webp" | sha256sum --check
          file app/src/main/res/drawable-nodpi/impulse_splash.webp
          rm -rf .tmp

      - name: Commit restored asset
        run: |
          set -euo pipefail
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore valid splash artwork"
          git push origin HEAD:fix/splash-audio-0.3.1
