name: Finalize splash asset

on:
  push:
    branches:
      - 'fix/splash-audio-0.3.1'

permissions:
  contents: write

jobs:
  finalize:
    name: Finalize valid splash asset
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Restore splash asset
        run: |
          set -euo pipefail
          cat .tmp/impulse_splash.part-* | base64 --decode > app/src/main/res/drawable-nodpi/impulse_splash.webp
          test "$(stat -c%s app/src/main/res/drawable-nodpi/impulse_splash.webp)" = "64638"
          echo "0127a264ea8f080338b61cb0865a5e53598a5c3250ff371f8fef26acd034831b  app/src/main/res/drawable-nodpi/impulse_splash.webp" | sha256sum --check
          file app/src/main/res/drawable-nodpi/impulse_splash.webp
          rm -rf .tmp .github/workflows/finalize-splash-asset.yml

      - name: Commit restored asset
        run: |
          set -euo pipefail
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore valid splash artwork"
          git push origin HEAD:fix/splash-audio-0.3.1
