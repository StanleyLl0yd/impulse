name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [main]
    paths:
      - gradle/wrapper/gradle-wrapper.properties
      - build.gradle.kts
      - settings.gradle.kts
  workflow_dispatch:

permissions: {}

concurrency:
  group: bootstrap-gradle-wrapper
  cancel-in-progress: false

jobs:
  create-wrapper-pr:
    name: Create wrapper PR when missing
    if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.5.0'
          cache-provider: basic
          cache-read-only: true

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 9.5.0 --distribution-type bin

      - name: Create branch and commit wrapper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="chore/add-gradle-wrapper"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m "chore: add Gradle wrapper"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease origin "$branch"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: add Gradle wrapper" \
            --body "Adds the Gradle Wrapper generated by Gradle 9.5.0 so local and CI builds use the repository-pinned toolchain."
