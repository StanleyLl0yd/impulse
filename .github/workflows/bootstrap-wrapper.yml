name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-wrapper.yml
      - gradle/wrapper/gradle-wrapper.properties
      - build.gradle.kts
      - settings.gradle.kts
  workflow_dispatch:

permissions: {}

concurrency:
  group: bootstrap-gradle-wrapper
  cancel-in-progress: false

jobs:
  create-wrapper-pr:
    name: Create wrapper PR when missing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check wrapper
        id: wrapper
        shell: bash
        run: |
          if [[ -f gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.wrapper.outputs.missing == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        if: steps.wrapper.outputs.missing == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.5.0'
          cache-provider: basic
          cache-read-only: true

      - name: Generate wrapper
        if: steps.wrapper.outputs.missing == 'true'
        run: gradle wrapper --gradle-version 9.5.0 --distribution-type bin

      - name: Create branch and commit wrapper
        if: steps.wrapper.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="chore/add-gradle-wrapper"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m "chore: add Gradle wrapper"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease origin "$branch"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: add Gradle wrapper" \
            --body "Adds the Gradle Wrapper generated by Gradle 9.5.0 so local and CI builds use the repository-pinned toolchain."
