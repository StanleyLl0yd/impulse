name: Android Gradle setup
description: Configure JDK, Android SDK tools, and Gradle for Android workflows

inputs:
  android-packages:
    description: Packages installed by setup-android
    required: false
    default: platform-tools
  gradle-cache-read-only:
    description: Whether the Gradle cache is read-only
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      with:
        packages: ${{ inputs.android-packages }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-provider: basic
        cache-read-only: ${{ inputs.gradle-cache-read-only }}
        validate-wrappers: true
